name: 📝 PR Title Comment

# Posts / updates / deletes the PR-title lint sticky comment on FORK PRs, where
# the pull_request-triggered pr-title.yml only has a read-only token. Same-repo
# PRs are commented on by pr-title.yml itself. workflow_run runs from the base
# branch with the base repo's token. This is comment-only — the required check
# stays pr-title.yml.
on:
  workflow_run:
    workflows: ["📝 PR Title"]
    types: [completed]

permissions:
  contents: read
  actions: read # download the artifact from the triggering run
  pull-requests: write # post/update/delete the sticky comment

# One group per PR branch, so a newer lint result cancels a stale queued run
# instead of each one holding a runner to post the same comment.
concurrency:
  group: pr-title-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    # Only run when the lint run actually produced a result artifact: a run
    # cancelled by concurrency (rapid pushes to the same PR) completes with
    # conclusion "cancelled" before uploading it, and would fail the download.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-26.04
    steps:
      # Checks out the default branch, so the composite action runs trusted
      # code from this repo, never from the fork.
      - name: 📥 Checkout comment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          show-progress: false
          persist-credentials: false

      - name: ⬇️ Download lint result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --name pr-title-result \
            --dir result

      - name: 🔎 Read result
        id: result
        run: |
          echo "number=$(cat result/number)" >> "$GITHUB_OUTPUT"
          {
            echo "error<<PR_TITLE_ERR_EOF"
            cat result/error
            echo
            echo "PR_TITLE_ERR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 💬 Post or clear title error
        uses: ./.github/actions/pr-title-comment
        with:
          number: ${{ steps.result.outputs.number }}
          error: ${{ steps.result.outputs.error }}
