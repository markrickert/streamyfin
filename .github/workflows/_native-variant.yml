name: 🧩 Native Variant

# Builds or repacks a single variant from scripts/build-cache/variants.ts.
# Called by build-apps.yml once per variant so every variant shares one setup,
# upload, and comment-refresh pipeline.
on:
  workflow_call:
    inputs:
      variant:
        description: Variant id from scripts/build-cache/variants.ts
        required: true
        type: string
      artifact-name:
        description: Artifact name from scripts/build-cache/cli.ts, or empty to hash in the build job
        required: false
        default: ""
        type: string
      source-run-id:
        description: Earlier run id to repack from, or empty to build in full
        required: false
        default: ""
        type: string
      mode:
        description: Cache mode (repack or ensure)
        required: true
        type: string
      build:
        description: For ensure variants, "true" to build or "false" to skip
        required: false
        default: "false"
        type: string
      retention-days:
        description: Artifact retention in days from variants.ts
        required: true
        type: number
      repack-name:
        description: Display name for the repack job
        required: false
        default: ""
        type: string
      build-name:
        description: Display name for the build job
        required: true
        type: string
    outputs:
      build-result:
        description: Result of the fallback build job
        value: ${{ jobs.build.result }}

# Exposed to `expo prebuild` (app.config.ts → extra.build) so Settings can show the
# branch + commit + Actions run a CI build was made from. EAS cloud builds use
# EAS_BUILD_* instead. The run number maps a sideloaded build back to its Actions
# run (artifacts + logs) without needing Expo access.
env:
  EXPO_PUBLIC_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
  EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
  EXPO_PUBLIC_GIT_RUN_NUMBER: ${{ github.run_number }}

jobs:
  # Repacks an earlier binary on Linux when a trusted source exists, freeing
  # macOS runners for native changes; the build job below runs when it did not
  # succeed.
  repack:
    if: ${{ !cancelled() && inputs.mode == 'repack' && inputs.source-run-id != '' }}
    runs-on: ubuntu-26.04
    # A repack takes 2 to 3 minutes; a hung one fails here and the build runs.
    timeout-minutes: 15
    name: ${{ inputs.repack-name || format('Repack {0}', inputs.variant) }}
    permissions:
      contents: read
      actions: write # dispatch artifact-comment.yml to refresh the PR comment

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false
          # PR code runs below and has no use for a git credential in .git/config.
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.4"

      - name: ☕ Set up JDK 17
        if: startsWith(inputs.variant, 'android-')
        # The repack needs Java for the apktool that repack-app runs.
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📦 Repack the earlier binary
        uses: ./.github/actions/repack
        with:
          platform: ${{ startsWith(inputs.variant, 'android-') && 'android' || 'ios' }}
          source-run-id: ${{ inputs.source-run-id }}
          artifact-name: ${{ inputs.artifact-name }}
          output: ${{ startsWith(inputs.variant, 'android-') && 'android/app/build/outputs/apk/release/app-release.apk' || 'build/Streamyfin.ipa' }}
          tv: ${{ contains(inputs.variant, '-tv-') && '1' || '0' }}
          expo-token: ${{ inputs.variant == 'ios-phone-release-device-signed' && secrets.EXPO_TOKEN || '' }}
          # The app and every extension it embeds; each needs its own profile.
          bundle-identifiers: ${{ inputs.variant == 'ios-phone-release-device-signed' && 'com.fredrikburmester.streamyfin com.fredrikburmester.streamyfin.downloadactivity' || '' }}
          # The macOS job below builds with eas build --profile ci.
          build-profile: ${{ inputs.variant == 'ios-phone-release-device-signed' && 'ci' || '' }}

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ startsWith(inputs.variant, 'android-') && 'android/app/build/outputs/apk/release/*.apk' || 'build/*.ipa' }}
          retention-days: ${{ inputs.retention-days }}
          # A repack that uploads nothing must fail, or its skipped build would pass.
          if-no-files-found: error
          # The name is the same on a re-run of this run, which keeps its artifacts.
          overwrite: true

      - name: 🔄 Refresh PR build comment
        uses: ./.github/actions/refresh-pr-comment

  build:
    needs: repack
    # always() keeps a skipped repack job from skipping this build, which for
    # required variants would count as a pass. Repack variants build when no
    # earlier source exists or repack did not succeed; ensure variants build
    # only when missing or near expiry.
    if: ${{ always() && !cancelled() && ((inputs.mode == 'repack' && (inputs.source-run-id == '' || needs.repack.result != 'success')) || (inputs.mode == 'ensure' && inputs.build == 'true')) }}
    runs-on: ${{ startsWith(inputs.variant, 'ios-') && 'xcode-27' || 'ubuntu-26.04' }}
    name: ${{ inputs.build-name }}
    permissions:
      contents: read
      actions: write # dispatch artifact-comment.yml to refresh the PR comment

    steps:
      # Checkout stays sequential before any setup step: the runner rewrites the
      # shared event.json as each step starts, and checkout crashes with
      # "Unexpected end of JSON input" when it reads the file mid-write.
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
          # PR code runs below and has no use for a git credential in .git/config.
          persist-credentials: false

      - name: 🗑️ Free Disk Space
        if: startsWith(inputs.variant, 'android-')
        uses: BRAINSia/free-disk-space@7048ffbf50819342ac964ef3998a51c2564a8a75 # v2.1.3
        with:
          tool-cache: false
          mandb: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.4"

      - name: ☕ Set up JDK 17
        if: startsWith(inputs.variant, 'android-')
        # ubuntu-26.04 defaults to JDK 25, which breaks the RN/AGP native build
        # (Kotlin falls back to JVM_23, the foojay toolchain + CMake configure
        # fail). Pin Temurin 17 for a deterministic Android build.
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: 🏗️ Setup EAS
        if: inputs.variant == 'ios-phone-release-device-signed'
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # main
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-cache: true

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 💾 Cache Gradle global
        if: startsWith(inputs.variant, 'android-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏷️ Resolve artifact name
        id: artifact
        # An empty name means the fingerprint job failed. Hash here once, on the
        # tree that job hashes, before prebuild, so the binary stays reusable.
        # If that fails too, take a name no lookup will ever match.
        env:
          VARIANT: ${{ inputs.variant }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ -n "$ARTIFACT_NAME" ]; then
            name="$ARTIFACT_NAME"
          elif name=$(bun scripts/build-cache/cli.ts name "$VARIANT"); then
            echo "::warning::The fingerprint job failed; $VARIANT was hashed in its build job instead."
          else
            name=$(bun scripts/build-cache/cli.ts fallback-name "$VARIANT" "$RUN_ID" "$RUN_ATTEMPT")
            echo "::warning::$VARIANT was built without a fingerprint and will not be reused."
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: 🛠️ Generate project files
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          if [[ "$VARIANT" == *-tv-* ]]; then
            bun run prebuild:tv
          elif [[ "$VARIANT" == *-phone-* ]]; then
            bun run prebuild
          else
            echo "::error::Unknown variant form for $VARIANT"
            exit 1
          fi

      - name: 💾 Cache project Gradle (.gradle)
        if: startsWith(inputs.variant, 'android-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android/.gradle
          key: ${{ runner.os }}-${{ runner.arch }}-android-gradle-develop-${{ hashFiles('android/**/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-android-gradle-develop

      - name: 🚀 Build app
        id: build
        env:
          VARIANT: ${{ inputs.variant }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          # Read variant metadata directly from variants.ts so ABIs and build
          # flags stay in one place.
          vars=$(bun -e '
            import { variantById } from "./scripts/build-cache/variants.ts";
            const v = variantById(process.argv[1]);
            if (!v) process.exit(1);
            for (const [k, val] of [
              ["v_os", v.os],
              ["v_form", v.form],
              ["v_config", v.config],
              ["v_target", v.target],
              ["v_signing", v.signing],
              ["v_abis", v.abis.join(",")],
            ]) console.log(`${k}=${JSON.stringify(val)}`);
          ' "$VARIANT") || { echo "::error::Could not read variant $VARIANT from variants.ts"; exit 1; }
          eval "$vars"
          [ -n "$v_os" ] || { echo "::error::Unknown variant $VARIANT"; exit 1; }

          if [ "$v_form" = "tv" ]; then
            export EXPO_TV=1
          elif [ "$v_form" = "phone" ]; then
            export EXPO_TV=0
          else
            echo "::error::No build recipe for $VARIANT"
            exit 1
          fi

          # Simulator .app bundles contain symlinks and file modes that upload-artifact's
          # zip flattens unless wrapped in a tar first.
          build_ios_simulator() {
            local xc_config="$1"
            local sdk
            if [ "$v_form" = "tv" ]; then
              sdk="appletvsimulator"
            elif [ "$v_form" = "phone" ]; then
              sdk="iphonesimulator"
            else
              echo "::error::No build recipe for $VARIANT"
              exit 1
            fi

            shopt -s nullglob
            workspaces=(ios/*.xcworkspace)
            [ "${#workspaces[@]}" -eq 1 ] || {
              echo "::error::Expected one .xcworkspace under ios/, found ${#workspaces[@]}"
              exit 1
            }
            workspace="${workspaces[0]}"
            scheme=$(basename "$workspace" .xcworkspace)
            derived="$RUNNER_TEMP/DerivedData"
            extra_args=()
            if [ "$xc_config" = "Release" ]; then
              # Simulator Release builds need no Apple cert or provisioning profile.
              extra_args+=(CODE_SIGNING_ALLOWED=NO)
            fi

            xcodebuild \
              -workspace "$workspace" \
              -scheme "$scheme" \
              -configuration "$xc_config" \
              -sdk "$sdk" \
              -derivedDataPath "$derived" \
              "${extra_args[@]}" \
              build

            products="$derived/Build/Products/${xc_config}-${sdk}"
            apps=("$products"/*.app)
            [ "${#apps[@]}" -eq 1 ] || {
              echo "::error::Expected one .app under $products, found ${#apps[@]}"
              exit 1
            }
            app_name=$(basename "${apps[0]}")
            mkdir -p "$RUNNER_TEMP/artifact"
            tar_path="$RUNNER_TEMP/artifact/${ARTIFACT_NAME}.tar"
            # COPYFILE_DISABLE=1 stops macOS tar from adding AppleDouble (._*) files.
            COPYFILE_DISABLE=1 tar -cf "$tar_path" -C "$products" "$app_name"
            echo "artifact_path=$tar_path" >> "$GITHUB_OUTPUT"
          }

          if [ "$v_os" = "android" ] && [ "$v_config" = "debug" ] && [ "$v_target" = "device" ]; then
            export ORG_GRADLE_PROJECT_reactNativeArchitectures="$v_abis"
            (cd android && ./gradlew assembleDebug)
            echo "artifact_path=android/app/build/outputs/apk/debug/*.apk" >> "$GITHUB_OUTPUT"
          elif [ "$v_os" = "android" ] && [ "$v_config" = "release" ] && [ "$v_target" = "device" ]; then
            export ORG_GRADLE_PROJECT_reactNativeArchitectures="$v_abis"
            # Keep R8 minification and resource shrinking enabled for release APKs.
            bun run build:android:local
            echo "artifact_path=android/app/build/outputs/apk/release/*.apk" >> "$GITHUB_OUTPUT"
          elif [ "$v_os" = "ios" ] && [ "$v_config" = "release" ] && [ "$v_target" = "device" ]; then
            if [ "$v_signing" = "signed" ] && [ "$v_form" = "phone" ]; then
              # `ci` profile (extends production, autoIncrement off): keeps CI builds out
              # of the production version tier and stops them inflating the store counter.
              eas build -p ios --local --non-interactive --profile ci
              {
                echo "artifact_path<<EOF"
                echo "build-*.ipa"
                echo "build/*.ipa"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
            elif [ "$v_signing" = "unsigned" ] && [ "$v_form" = "tv" ]; then
              bun run ios:unsigned-build:tv
              echo "artifact_path=build/*.ipa" >> "$GITHUB_OUTPUT"
            elif [ "$v_signing" = "unsigned" ] && [ "$v_form" = "phone" ]; then
              bun run ios:unsigned-build
              echo "artifact_path=build/*.ipa" >> "$GITHUB_OUTPUT"
            else
              echo "::error::No build recipe for $VARIANT"
              exit 1
            fi
          elif [ "$v_os" = "ios" ] && [ "$v_config" = "release" ] && [ "$v_target" = "simulator" ]; then
            export NODE_ENV=production
            build_ios_simulator Release
          elif [ "$v_os" = "ios" ] && [ "$v_config" = "debug" ] && [ "$v_target" = "simulator" ]; then
            build_ios_simulator Debug
          else
            echo "::error::No build recipe for $VARIANT"
            exit 1
          fi

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.build.outputs.artifact_path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          # The name is the same on a re-run of this run, which keeps its artifacts.
          overwrite: true

      - name: 🔄 Refresh PR build comment
        uses: ./.github/actions/refresh-pr-comment
