name: 📸 E2E Screenshots (iOS)

# Compares two refs screen-for-screen on an iOS simulator debug dev client using
# the native SyncPlay+Seerr fixture. Runs only on demand (PR label or manual dispatch)
# because a full run can compile two Debug iOS clients and execute three Maestro passes.

on:
  pull_request:
    # `labeled` fires once per application, so later pushes do not rerun this job;
    # remove and re-add the `run-screenshots` label to rerun.
    types: [labeled]
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      before:
        description: Base ref or commit to compare against
        required: true
        type: string
      after:
        description: Target ref or commit to compare (defaults to the dispatched ref)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Every label fires this workflow; keyed by label, another label's skipped run can
  # never cancel a running comparison.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || 'dispatch' }}
  cancel-in-progress: true

jobs:
  screenshots-ios:
    name: 📸 Screenshot comparison (iOS)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'run-screenshots')
    # A standard runner on purpose: the native fixture exists so this runs where Docker
    # cannot. build-apps.yml's xcode-27 runners serve only this repository's own PRs.
    runs-on: macos-latest
    # Up to two Debug iOS dev-client builds plus native fixture setup and three Maestro passes.
    timeout-minutes: 120

    steps:
      - name: 🛠️ Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          [ -n "$xcode" ] || { echo "::error::No Xcode on this image"; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version


      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
          # PR code runs below and has no use for a git credential in .git/config.
          persist-credentials: false

      - name: 🔎 Ensure comparison refs exist locally
        # The runner switches the checkout between `before` and `after` with `git switch --detach`.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_BEFORE: ${{ inputs.before }}
          INPUT_AFTER: ${{ inputs.after }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          resolve_ref() {
            local ref="$1"
            if git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
              echo "$ref"
              return 0
            fi
            if git rev-parse --verify "origin/${ref}^{commit}" >/dev/null 2>&1; then
              echo "origin/${ref}"
              return 0
            fi
            git fetch --no-tags origin "${ref#origin/}:refs/remotes/origin/${ref#origin/}" >/dev/null 2>&1 ||
              git fetch --no-tags origin "$ref" >/dev/null 2>&1 || true
            if git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
              echo "$ref"
              return 0
            fi
            if git rev-parse --verify "origin/${ref}^{commit}" >/dev/null 2>&1; then
              echo "origin/${ref}"
              return 0
            fi
            echo "::error::Could not resolve ref '$ref' locally" >&2
            return 1
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            raw_before="origin/$PR_BASE_REF"
            raw_after="$PR_HEAD_SHA"
          else
            raw_before="$INPUT_BEFORE"
            raw_after="${INPUT_AFTER:-$DISPATCH_SHA}"
          fi

          before_ref="$(resolve_ref "$raw_before")"
          after_ref="$(resolve_ref "$raw_after")"
          {
            echo "BEFORE_REF=$before_ref"
            echo "AFTER_REF=$after_ref"
          } >> "$GITHUB_ENV"

      - name: 🟢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Seerr v3.5.0 sets engine-strict with node ^22.19.0.
          node-version: "22"

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.4"

      - name: ☕ Set up JDK 17
        # Maestro requires Java 17 on PATH.
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: 🎞️ Install ffmpeg
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 💾 Cache native fixture tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e/suites/syncplay/.tools
          key: ${{ runner.os }}-${{ runner.arch }}-syncplay-tools-${{ hashFiles('e2e/suites/syncplay/native.py') }}

      - name: 💾 Cache pinned Maestro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e/reports/shots/tools
          key: ${{ runner.os }}-${{ runner.arch }}-maestro-${{ hashFiles('e2e/suites/screenshots/lib/tooling.ts') }}

      - name: 💾 Cache debug dev clients
        # Fingerprint hashes are computed per ref at runtime, so restore the latest
        # cache set by prefix and save the pruned set under this run's unique key.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e/reports/shots/build-cache
          key: ${{ runner.os }}-${{ runner.arch }}-shots-ios-build-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-shots-ios-build-cache-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📱 Create and boot iOS simulator
        run: |
          udid="$(python3 - <<'EOF'
          import json, subprocess

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j"], text=True))
          runtimes = [
              r for r in data.get("runtimes", [])
              if r.get("isAvailable") and (
                  r.get("platform") == "iOS"
                  or r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
              )
          ]
          if not runtimes:
              raise SystemExit("No available iOS simulator runtime found")
          runtimes.sort(key=lambda r: tuple(int(p) for p in r["version"].split(".")), reverse=True)
          runtime = runtimes[0]

          supported = runtime.get("supportedDeviceTypes") or data.get("devicetypes", [])
          by_name = {d["name"]: d["identifier"] for d in supported}
          device_type = next(
              (by_name[name] for name in ("iPhone 16", "iPhone 17", "iPhone 15") if name in by_name),
              None,
          )
          if not device_type:
              iphones = [d for d in supported if "iPhone" in d.get("name", "")]
              if not iphones:
                  raise SystemExit(f"No iPhone device type available for {runtime['identifier']}")
              device_type = iphones[0]["identifier"]

          udid = subprocess.check_output(
              ["xcrun", "simctl", "create", "e2e-screenshots-ios", device_type, runtime["identifier"]],
              text=True,
          ).strip()
          print(udid)
          EOF
          )"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

          xcrun simctl bootstatus "$udid" -b

          # Wait for first-boot ConfigurationProfiles plists before disabling AutoFill.
          dev="$HOME/Library/Developer/CoreSimulator/Devices/$udid/data"
          plists=(
            "$dev/Containers/Shared/SystemGroup/systemgroup.com.apple.configurationprofiles/Library/ConfigurationProfiles/UserSettings.plist"
            "$dev/Library/UserConfigurationProfiles/EffectiveUserSettings.plist"
            "$dev/Library/UserConfigurationProfiles/PublicInfo/PublicEffectiveUserSettings.plist"
          )
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            missing=0
            for f in "${plists[@]}"; do
              [ -f "$f" ] || { missing=1; break; }
            done
            [ "$missing" -eq 0 ] && break
            sleep 1
          done

          bash e2e/suites/screenshots/ios-disable-autofill.sh "$udid"

      - name: 📸 Run screenshot comparison
        # `shots.ts` exits 0 when screens change (changes are reported in summary.md) and
        # exits non-zero only on runner, build, capture, or blank-screenshot failures.
        env:
          SYNCPLAY_BACKEND: native
          GIT_TERMINAL_PROMPT: "0"
        run: |
          bun run e2e:shots \
            --platform ios \
            --before "$BEFORE_REF" \
            --after "$AFTER_REF" \
            --device "$SIMULATOR_UDID" \
            --out "${{ github.workspace }}/e2e/reports/shots/ci"

      - name: 🧹 Prune unused debug build cache
        # The runner does not report which cache hashes it read, so keep the newest 4
        # entries by mtime (two before/after pairs) so the cache cannot grow without bound.
        if: success()
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import shutil

          root = Path("e2e/reports/shots/build-cache")
          if root.is_dir():
              entries = [
                  entry
                  for platform_dir in root.iterdir()
                  if platform_dir.is_dir()
                  for entry in platform_dir.iterdir()
                  if entry.is_dir()
              ]
              entries.sort(key=lambda p: p.stat().st_mtime, reverse=True)
              for stale in entries[4:]:
                  shutil.rmtree(stale)
          EOF

      - name: 📝 Job summary
        if: always()
        run: |
          if [ -f e2e/reports/shots/ci/report/summary.md ]; then
            cat e2e/reports/shots/ci/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📤 Upload screenshot report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-ios-report
          # Upload reports, changed-screen evidence, and raw pass captures while omitting DerivedData.
          path: |
            e2e/reports/shots/ci/report/
            e2e/reports/shots/ci/evidence/
            e2e/reports/shots/ci/before/
            e2e/reports/shots/ci/noise/
            e2e/reports/shots/ci/after/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📤 Upload fixture logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-ios-fixture-logs
          path: e2e/suites/syncplay/.state/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧹 Tear down fixture
        if: always()
        env:
          SYNCPLAY_BACKEND: native
        run: |
          if [ -f e2e/suites/syncplay/.env ]; then
            bun run e2e:down
          fi

      - name: 🧹 Delete iOS simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID" || true
