name: 📝 Artifact Comment on PR

# Settles the PR build comment once a whole Build Apps run completes. The build
# jobs update it live as each one ends, see `scripts/ci/artifact-comment.ts`;
# this run is the backstop that writes the final state.
concurrency:
  group: artifact-comment-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

on:
  workflow_dispatch: # Allow manual testing
  workflow_run:
    workflows:
      - "🏗️ Build Apps"
    types:
      - completed

jobs:
  comment-artifacts:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    name: 📦 Post Build Artifacts
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      # workflow_run checks out the default branch, so the script never runs
      # code from the pull request.
      - name: 📥 Checkout comment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
          show-progress: false
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.4"

      - name: 🔍 Get PR and Artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/ci/artifact-comment.ts
