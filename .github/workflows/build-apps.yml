name: 🏗️ Build Apps

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to develop must finish: its iOS artifacts are the binaries that pull
  # requests and merge queue entries repack (see the fingerprint job). So must
  # the weekly full build and a manual run, which share develop's group.
  cancel-in-progress: ${{ !contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) }}

on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Build every app in full, without repacking an earlier build
        type: boolean
        default: false
  # Every repack uploads the binary it started from again, so without this a
  # native binary could be reused for months, built with a toolchain long
  # gone. A weekly full build on develop gives every later repack a binary at
  # most a week old.
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    branches: [develop, master]
  merge_group:
    types: [checks_requested]
  push:
    branches: [develop, master]

# Exposed to `expo prebuild` (app.config.ts → extra.build) so Settings can show the
# branch + commit + Actions run a CI build was made from. EAS cloud builds use
# EAS_BUILD_* instead. The run number maps a sideloaded build back to its Actions
# run (artifacts + logs) without needing Expo access.
env:
  EXPO_PUBLIC_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
  EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
  EXPO_PUBLIC_GIT_RUN_NUMBER: ${{ github.run_number }}

jobs:
  # Hashes the native project with `@expo/fingerprint`, finds earlier trusted
  # builds for repack variants, and checks whether ensure variants need a build.
  # A repack match swaps JS into that binary on Linux in minutes, freeing scarce
  # macOS runners and skipping Gradle builds in the merge queue.
  fingerprint:
    if: (!contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-26.04
    name: 🧬 Native Fingerprint
    permissions:
      contents: read
      actions: read # list and download earlier runs' artifacts
    outputs:
      can_sign: ${{ steps.signing.outputs.can_sign }}
      ios_hash: ${{ steps.hash.outputs.ios }}
      tv_hash: ${{ steps.hash.outputs.tv }}
      android_hash: ${{ steps.hash.outputs.android }}
      android_tv_hash: ${{ steps.hash.outputs.android_tv }}
      ios_phone_release_device_signed_name: ${{ steps.hash.outputs.ios-phone-release-device-signed_name }}
      ios_phone_release_device_unsigned_name: ${{ steps.hash.outputs.ios-phone-release-device-unsigned_name }}
      ios_tv_release_device_unsigned_name: ${{ steps.hash.outputs.ios-tv-release-device-unsigned_name }}
      android_phone_release_device_debugkey_name: ${{ steps.hash.outputs.android-phone-release-device-debugkey_name }}
      android_tv_release_device_debugkey_name: ${{ steps.hash.outputs.android-tv-release-device-debugkey_name }}
      ios_phone_debug_simulator_unsigned_name: ${{ steps.hash.outputs.ios-phone-debug-simulator-unsigned_name }}
      ios_tv_debug_simulator_unsigned_name: ${{ steps.hash.outputs.ios-tv-debug-simulator-unsigned_name }}
      android_phone_debug_device_debugkey_name: ${{ steps.hash.outputs.android-phone-debug-device-debugkey_name }}
      android_tv_debug_device_debugkey_name: ${{ steps.hash.outputs.android-tv-debug-device-debugkey_name }}
      ios_phone_release_simulator_unsigned_name: ${{ steps.hash.outputs.ios-phone-release-simulator-unsigned_name }}
      ios_tv_release_simulator_unsigned_name: ${{ steps.hash.outputs.ios-tv-release-simulator-unsigned_name }}
      android_phone_release_device_debugkey_universal_name: ${{ steps.hash.outputs.android-phone-release-device-debugkey-universal_name }}
      android_tv_release_device_debugkey_universal_name: ${{ steps.hash.outputs.android-tv-release-device-debugkey-universal_name }}
      ios_phone_source: ${{ steps.find.outputs.ios_phone }}
      ios_phone_unsigned_source: ${{ steps.find.outputs.ios_phone_unsigned }}
      ios_tv_unsigned_source: ${{ steps.find.outputs.ios_tv_unsigned }}
      android_phone_source: ${{ steps.find.outputs.android_phone }}
      android_tv_source: ${{ steps.find.outputs.android_tv }}
      ios_phone_debug_simulator_unsigned_build: ${{ steps.ensure.outputs.ios-phone-debug-simulator-unsigned }}
      ios_tv_debug_simulator_unsigned_build: ${{ steps.ensure.outputs.ios-tv-debug-simulator-unsigned }}
      android_phone_debug_device_debugkey_build: ${{ steps.ensure.outputs.android-phone-debug-device-debugkey }}
      android_tv_debug_device_debugkey_build: ${{ steps.ensure.outputs.android-tv-debug-device-debugkey }}
      ios_phone_release_simulator_unsigned_build: ${{ steps.ensure.outputs.ios-phone-release-simulator-unsigned }}
      ios_tv_release_simulator_unsigned_build: ${{ steps.ensure.outputs.ios-tv-release-simulator-unsigned }}
      android_phone_release_device_debugkey_universal_build: ${{ steps.ensure.outputs.android-phone-release-device-debugkey-universal }}
      android_tv_release_device_debugkey_universal_build: ${{ steps.ensure.outputs.android-tv-release-device-debugkey-universal }}

    steps:
      # Job conditions cannot read secrets directly. Expose only token presence.
      - name: Check signed iOS credentials
        id: signing
        env:
          CAN_SIGN: ${{ secrets.EXPO_TOKEN != '' }}
        run: echo "can_sign=$CAN_SIGN" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.4"

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧬 Hash the native project
        id: hash
        # fingerprint.config.js keeps the per-build metadata out of the hash.
        # cli.ts hash checks that expoConfig is present and applies the shared
        # Android ignore paths so CI and local hashes never drift.
        run: |
          ios=$(bun scripts/build-cache/cli.ts hash ios phone)
          tv=$(bun scripts/build-cache/cli.ts hash ios tv)
          android=$(bun scripts/build-cache/cli.ts hash android phone)
          android_tv=$(bun scripts/build-cache/cli.ts hash android tv)
          {
            echo "ios=$ios"
            echo "tv=$tv"
            echo "android=$android"
            echo "android_tv=$android_tv"
          } >> "$GITHUB_OUTPUT"
          bun scripts/build-cache/cli.ts outputs \
            ios="$ios" \
            tv="$tv" \
            android="$android" \
            android_tv="$android_tv" >> "$GITHUB_OUTPUT"

      - name: 🔎 Find an earlier build to repack
        id: find
        # Left out, every repack job builds in full: the weekly rebuild and on request.
        if: github.event_name != 'schedule' && !inputs.full_build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          IOS: ${{ steps.hash.outputs.ios }}
          TV: ${{ steps.hash.outputs.tv }}
          ANDROID: ${{ steps.hash.outputs.android }}
          ANDROID_TV: ${{ steps.hash.outputs.android_tv }}
          CAN_SIGN: ${{ steps.signing.outputs.can_sign }}
        run: |
          names=(
            "ios_phone_unsigned=$(bun scripts/build-cache/cli.ts name ios-phone-release-device-unsigned "$IOS")"
            "ios_tv_unsigned=$(bun scripts/build-cache/cli.ts name ios-tv-release-device-unsigned "$TV")"
            "android_phone=$(bun scripts/build-cache/cli.ts name android-phone-release-device-debugkey "$ANDROID")"
            "android_tv=$(bun scripts/build-cache/cli.ts name android-tv-release-device-debugkey "$ANDROID_TV")"
          )
          if [ "$CAN_SIGN" = "true" ]; then
            names+=("ios_phone=$(bun scripts/build-cache/cli.ts name ios-phone-release-device-signed "$IOS")")
          fi
          # A failed lookup only means no earlier build is known: the outputs it
          # did not write stay empty, and those jobs build in full.
          bun scripts/ci/find-native-build.ts "${names[@]}" ||
            echo "::warning::The lookup for an earlier build failed; the jobs without a source build in full."

      - name: 🔎 Check which ensure variants need a build
        id: ensure
        # Ensure variants are skipped on merge_group and fork PRs. Unlike repack
        # variants, schedule and full_build still check the cache and rebuild an
        # ensure variant only when missing or near expiry.
        if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          IOS: ${{ steps.hash.outputs.ios }}
          TV: ${{ steps.hash.outputs.tv }}
          ANDROID: ${{ steps.hash.outputs.android }}
          ANDROID_TV: ${{ steps.hash.outputs.android_tv }}
        run: |
          entries=(
            "ios-phone-debug-simulator-unsigned:$IOS"
            "ios-tv-debug-simulator-unsigned:$TV"
            "android-phone-debug-device-debugkey:$ANDROID"
            "android-tv-debug-device-debugkey:$ANDROID_TV"
            "ios-phone-release-simulator-unsigned:$IOS"
            "ios-tv-release-simulator-unsigned:$TV"
            "android-phone-release-device-debugkey-universal:$ANDROID"
            "android-tv-release-device-debugkey-universal:$ANDROID_TV"
          )
          for entry in "${entries[@]}"; do
            variant="${entry%%:*}"
            hash="${entry#*:}"
            if verdict=$(bun scripts/build-cache/cli.ts needs-build "$variant" "$hash") && [ "$verdict" = "skip" ]; then
              echo "$variant=false" >> "$GITHUB_OUTPUT"
            else
              echo "$variant=true" >> "$GITHUB_OUTPUT"
            fi
          done

  # Repack only when the fingerprint job found a trusted source.
  ios-phone-release-device-signed:
    needs: fingerprint
    if: ${{ always() && !cancelled() && needs.fingerprint.result == 'success' && needs.fingerprint.outputs.ios_phone_source != '' && needs.fingerprint.outputs.can_sign != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      actions: write # the called jobs dispatch artifact-comment.yml to refresh the PR comment
    uses: ./.github/workflows/_native-variant.yml
    secrets: inherit
    with:
      variant: ios-phone-release-device-signed
      artifact-name: ${{ needs.fingerprint.outputs.ios_phone_release_device_signed_name }}
      source-run-id: ${{ needs.fingerprint.outputs.ios_phone_source }}
      retention-days: 7
      repack-name: 🍎 Repack iOS IPA (Phone)

  ios-phone-release-device-unsigned:
    needs: fingerprint
    if: ${{ always() && !cancelled() && needs.fingerprint.result == 'success' && needs.fingerprint.outputs.ios_phone_unsigned_source != '' }}
    permissions:
      contents: read
      actions: write # the called jobs dispatch artifact-comment.yml to refresh the PR comment
    uses: ./.github/workflows/_native-variant.yml
    secrets: inherit
    with:
      variant: ios-phone-release-device-unsigned
      artifact-name: ${{ needs.fingerprint.outputs.ios_phone_release_device_unsigned_name }}
      source-run-id: ${{ needs.fingerprint.outputs.ios_phone_unsigned_source }}
      retention-days: 7
      repack-name: 🍎 Repack iOS IPA (Phone - Unsigned)

  ios-tv-release-device-unsigned:
    # The only tvOS device build in CI: it needs no Apple credentials. Signed
    # tvOS builds come from release.yml, which holds the tvOS signing files.
    needs: fingerprint
    if: ${{ always() && !cancelled() && needs.fingerprint.result == 'success' && needs.fingerprint.outputs.ios_tv_unsigned_source != '' }}
    permissions:
      contents: read
      actions: write # the called jobs dispatch artifact-comment.yml to refresh the PR comment
    uses: ./.github/workflows/_native-variant.yml
    secrets: inherit
    with:
      variant: ios-tv-release-device-unsigned
      artifact-name: ${{ needs.fingerprint.outputs.ios_tv_release_device_unsigned_name }}
      source-run-id: ${{ needs.fingerprint.outputs.ios_tv_unsigned_source }}
      retention-days: 7
      repack-name: 🍎 Repack tvOS IPA (Unsigned)

  android-phone-release-device-debugkey:
    needs: fingerprint
    if: ${{ always() && !cancelled() && needs.fingerprint.result == 'success' && needs.fingerprint.outputs.android_phone_source != '' }}
    permissions:
      contents: read
      actions: write # the called jobs dispatch artifact-comment.yml to refresh the PR comment
    uses: ./.github/workflows/_native-variant.yml
    secrets: inherit
    with:
      variant: android-phone-release-device-debugkey
      artifact-name: ${{ needs.fingerprint.outputs.android_phone_release_device_debugkey_name }}
      source-run-id: ${{ needs.fingerprint.outputs.android_phone_source }}
      retention-days: 7
      repack-name: 🤖 Repack Android APK (Phone)

  android-tv-release-device-debugkey:
    needs: fingerprint
    if: ${{ always() && !cancelled() && needs.fingerprint.result == 'success' && needs.fingerprint.outputs.android_tv_source != '' }}
    permissions:
      contents: read
      actions: write # the called jobs dispatch artifact-comment.yml to refresh the PR comment
    uses: ./.github/workflows/_native-variant.yml
    secrets: inherit
    with:
      variant: android-tv-release-device-debugkey
      artifact-name: ${{ needs.fingerprint.outputs.android_tv_release_device_debugkey_name }}
      source-run-id: ${{ needs.fingerprint.outputs.android_tv_source }}
      retention-days: 7
      repack-name: 🤖 Repack Android APK (TV)

  plan-native-builds:
    needs: [fingerprint, ios-phone-release-device-signed, ios-phone-release-device-unsigned, ios-tv-release-device-unsigned, android-phone-release-device-debugkey, android-tv-release-device-debugkey]
    if: ${{ always() && !cancelled() && needs.fingerprint.result != 'skipped' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-26.04
    name: Plan full native builds
    permissions:
      contents: read
    outputs:
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Select missing or failed variants
        id: plan
        env:
          FINGERPRINT_RESULT: ${{ needs.fingerprint.result }}
          FINGERPRINT_OUTPUTS: ${{ toJSON(needs.fingerprint.outputs) }}
          CAN_SIGN: ${{ needs.fingerprint.outputs.can_sign != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          REPACK_IOS_PHONE_RELEASE_DEVICE_SIGNED: ${{ needs.ios-phone-release-device-signed.result }}
          REPACK_IOS_PHONE_RELEASE_DEVICE_UNSIGNED: ${{ needs.ios-phone-release-device-unsigned.result }}
          REPACK_IOS_TV_RELEASE_DEVICE_UNSIGNED: ${{ needs.ios-tv-release-device-unsigned.result }}
          REPACK_ANDROID_PHONE_RELEASE_DEVICE_DEBUGKEY: ${{ needs.android-phone-release-device-debugkey.result }}
          REPACK_ANDROID_TV_RELEASE_DEVICE_DEBUGKEY: ${{ needs.android-tv-release-device-debugkey.result }}
        run: bun scripts/build-cache/plan-ci.ts >> "$GITHUB_OUTPUT"

  build-android:
    needs: plan-native-builds
    if: ${{ needs.plan-native-builds.outputs.android != '{}' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/_native-build-group.yml
    secrets: inherit
    with:
      platform: android
      plan: ${{ needs.plan-native-builds.outputs.android }}

  build-ios:
    needs: plan-native-builds
    if: ${{ needs.plan-native-builds.outputs.ios != '{}' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/_native-build-group.yml
    secrets: inherit
    with:
      platform: ios
      plan: ${{ needs.plan-native-builds.outputs.ios }}

  # ── Required status-check gates ─────────────────────────────────────────────
  # Repository rulesets require these exact check names. Each gate passes only
  # when its caller succeeded (or recovered via the fallback build), or was
  # intentionally skipped.
  gate-ios-phone:
    needs: [fingerprint, ios-phone-release-device-signed, build-ios]
    if: always() && !cancelled()
    runs-on: ubuntu-26.04
    name: 🍎 Build iOS IPA (Phone)
    permissions:
      contents: read
    env:
      RESULT: ${{ needs.ios-phone-release-device-signed.result }}
      BUILD_RESULT: ${{ needs.build-ios.outputs.ios-phone-release-device-signed }}
      SKIP_CI: ${{ contains(github.event.head_commit.message, '[skip ci]') }}
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      CAN_SIGN: ${{ needs.fingerprint.outputs.can_sign }}
      IS_FORK_REPO: ${{ github.event.repository.fork }}
    steps:
      # A fork without credentials cannot sign. Missing credentials on the
      # canonical repository must still fail the required check.
      - name: ✅ Verify build result
        run: |
          if [ "$RESULT" = "success" ] || [ "$BUILD_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$RESULT" = "skipped" ] && { [ "$IS_FORK_PR" = "true" ] || [ "$SKIP_CI" = "true" ]; }; then
            exit 0
          fi
          if [ "$RESULT" = "skipped" ] && [ "$CAN_SIGN" = "false" ]; then
            if [ "$IS_FORK_REPO" = "true" ]; then
              echo "Skipping signed iOS build: EXPO_TOKEN is not configured on this fork."
              exit 0
            fi
            echo "::error::EXPO_TOKEN is not configured for the required signed iOS build."
            exit 1
          fi
          echo "::error::Build did not succeed (caller=$RESULT, build=$BUILD_RESULT)"
          exit 1

  gate-android-phone:
    needs: [android-phone-release-device-debugkey, build-android]
    if: always() && !cancelled()
    runs-on: ubuntu-26.04
    name: 🤖 Build Android APK (Phone)
    permissions:
      contents: read
    env:
      RESULT: ${{ needs.android-phone-release-device-debugkey.result }}
      BUILD_RESULT: ${{ needs.build-android.outputs.android-phone-release-device-debugkey }}
      SKIP_CI: ${{ contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: ✅ Verify build result
        run: |
          if [ "$RESULT" = "success" ] || [ "$BUILD_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$RESULT" = "skipped" ] && [ "$SKIP_CI" = "true" ]; then
            exit 0
          fi
          echo "::error::Build did not succeed (caller=$RESULT, build=$BUILD_RESULT)"
          exit 1

  gate-android-tv:
    needs: [android-tv-release-device-debugkey, build-android]
    if: always() && !cancelled()
    runs-on: ubuntu-26.04
    name: 🤖 Build Android APK (TV)
    permissions:
      contents: read
    env:
      RESULT: ${{ needs.android-tv-release-device-debugkey.result }}
      BUILD_RESULT: ${{ needs.build-android.outputs.android-tv-release-device-debugkey }}
      SKIP_CI: ${{ contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: ✅ Verify build result
        run: |
          if [ "$RESULT" = "success" ] || [ "$BUILD_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$RESULT" = "skipped" ] && [ "$SKIP_CI" = "true" ]; then
            exit 0
          fi
          echo "::error::Build did not succeed (caller=$RESULT, build=$BUILD_RESULT)"
          exit 1

  gate-ios-tv-unsigned:
    needs: [ios-tv-release-device-unsigned, build-ios]
    if: always() && !cancelled()
    runs-on: ubuntu-26.04
    name: 🍎 Build tvOS IPA (Unsigned)
    permissions:
      contents: read
    env:
      RESULT: ${{ needs.ios-tv-release-device-unsigned.result }}
      BUILD_RESULT: ${{ needs.build-ios.outputs.ios-tv-release-device-unsigned }}
      SKIP_CI: ${{ contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: ✅ Verify build result
        run: |
          if [ "$RESULT" = "success" ] || [ "$BUILD_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$RESULT" = "skipped" ] && [ "$SKIP_CI" = "true" ]; then
            exit 0
          fi
          echo "::error::Build did not succeed (caller=$RESULT, build=$BUILD_RESULT)"
          exit 1
