name: Build and upload one native variant
description: Build one variant after its group's shared prebuild and upload it immediately.
inputs:
  variant:
    description: Variant ID from scripts/build-cache/variants.ts
    required: true
  artifact-name:
    description: Artifact name resolved before prebuild
    required: true
  retention-days:
    description: GitHub artifact retention in days
    required: true
runs:
  using: composite
  steps:
    - name: Build app
      id: build
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/build-cache/build-native-variant.sh"

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.build.outputs.artifact_path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
        overwrite: true

    - name: Refresh PR build comment
      uses: ./.github/actions/refresh-pr-comment
