name: Refresh PR build comment
description: >-
  Update the PR build-status comment from inside the calling job, so it shows
  live per-platform progress as each build job finishes.

runs:
  using: composite
  steps:
    # Runs `scripts/ci/artifact-comment.ts` here instead of dispatching
    # artifact-comment.yml, which waited minutes in the runner queue for every
    # update. The calling step must keep the name the script looks for, see
    # `REFRESH_STEP` there. Skipped on forks (their token is read-only).
    # github.token is used because composite actions cannot read the secrets
    # context. The job needs `pull-requests: write` and `actions: read`.
    - if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: bun scripts/ci/artifact-comment.ts
