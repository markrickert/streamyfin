# Seerr screens on a phone: Discover, a search and a title's page. Needs
# bootstrap-seerr-mobile.yml to have run on this build. Discover rows are live TMDB data,
# so the noise floor decides whether they count; "Iron Man" is a fixed title for the pages
# below.
# Read-only: nothing here may create a request, which would change the Seerr server.
appId: ${MAESTRO_APP_ID}
---
- runFlow: _relaunch-home-mobile.yml
- tapOn: "Search"
- hideKeyboard:
    optional: true
# The pill can ignore a tap that lands while the page is still mounting, so tap it again
# until the Discover rows are there.
- tapOn: "Discover"
- repeat:
    while:
      notVisible: "Trending"
    times: 4
    commands:
      - extendedWaitUntil:
          visible: "Trending"
          timeout: 4000
          optional: true
      - runFlow:
          when:
            notVisible: "Trending"
          commands:
            - tapOn: "Discover"
- extendedWaitUntil:
    visible: "Trending"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 10-seerr-discover

# Typing before the keyboard is up drops the text and leaves the Discover page, whose own
# Iron Man card would satisfy the wait below. The typed query reads back as exactly
# "Iron Man", which no card label does (they carry the year), so retype until it is there.
- tapOn: '.*Search\.\.\..*'
- waitForAnimationToEnd:
    timeout: 1500
- inputText: "Iron Man"
- repeat:
    while:
      notVisible: "Iron Man"
    times: 3
    commands:
      - tapOn: '.*Search\.\.\..*'
      - waitForAnimationToEnd:
          timeout: 1500
      - inputText: "Iron Man"
- hideKeyboard:
    optional: true
- extendedWaitUntil:
    visible: ".*Iron Man.*"
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "More"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 11-seerr-search

# Iron Man (1931), TMDB id 194310, a public-domain film with a stable id across runs.
# The request sheet is deliberately not opened: its button creates a request on the Seerr
# server, and a mistimed tap would submit one.
# Refs before the SeerrPoster testID fall back to the card's label, which ends in the
# title and year on every ref. A bare "Iron Man" would also match the search field
# holding the query, and the other Iron Man cards.
# The fallback comes first. Each branch is its own check, so a testID tap that runs first
# leaves the detail page open, the poster is gone, and the fallback would run there too.
# The card is centred first: at the screen's edge its tap target can fall outside it.
- runFlow:
    when:
      notVisible:
        id: "seerr-poster-194310"
    commands:
      - scrollUntilVisible:
          element: ".*Iron Man, 1931"
          centerElement: true
      - tapOn: ".*Iron Man, 1931"
- runFlow:
    when:
      visible:
        id: "seerr-poster-194310"
    commands:
      - scrollUntilVisible:
          element:
            id: "seerr-poster-194310"
          centerElement: true
      - tapOn:
          id: "seerr-poster-194310"
- extendedWaitUntil:
    visible: ".*Iron Man.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 12-seerr-detail
