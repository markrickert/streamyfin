# Dismisses the Expo dev client's first-run overlays so the app underneath is reachable.
# On iOS the runner's dev-client deep link also raises the system "Open in <app>?"
# confirmation, which covers the app until it is accepted.
# Connecting a dev client to Metro for the first time can surface its onboarding sheet
# ("Continue") and then the dev menu (Reload / Go home / Tools) open over the app. Both
# block every selector below them, so bootstrap-login flows call this right after
# launchApp. Each step is guarded on the exact dev-menu labels and does nothing when the
# overlay never appeared.
# A dev client that exits after the runner's deep link comes back on launchApp with no
# Metro URL, on the server picker. The picker step re-opens the runner's link from
# MAESTRO_DEV_CLIENT_URL, and on iOS the "Open in" step below accepts that link too.
appId: ${MAESTRO_APP_ID}
---
# Waiting on a hung Pixel Launcher only defers its ANR dialog, which keeps
# re-raising over the app. Close the launcher; Android restarts it on Home.
- runFlow:
    when:
      platform: Android
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
      - waitForAnimationToEnd
# Every other hung process — our own app above all — must never get "Close app",
# because killing the app under test would end the run. It only gets "Wait".
- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
      - waitForAnimationToEnd
# Google TV can raise its first-run Shop dialog over any launch, taking the app out of
# the foreground: dismiss it and start the app again.
- runFlow:
    when:
      platform: Android
      visible: "Buy and rent movies on your TV"
    commands:
      - tapOn: "Dismiss"
      - launchApp
- runFlow:
    # Phone clients show "Fetch development servers"; tvOS shows "Searching for development servers...".
    # A finished search leaves its "DEVELOPMENT SERVERS" list up instead: same picker.
    when:
      visible: "Fetch development servers|Searching for development servers.*|DEVELOPMENT SERVERS|Enter URL manually"
    commands:
      - openLink: ${MAESTRO_DEV_CLIENT_URL}
      - waitForAnimationToEnd
# iOS taps "Open"; tvOS's PineBoard alert focuses "Open" by default and ignores tapOn,
# so press Select instead.
- runFlow:
    when:
      visible: "Open in .*"
      true: ${MAESTRO_TVOS != '1'}
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open in .*"
      true: ${MAESTRO_TVOS == '1'}
    commands:
      - pressKey: Remote Dpad Center
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
# The dev client's load-error screen is a timed-out bundle request; reopening the
# runner's link retries it, and the callers' loops wait for the result.
- runFlow:
    when:
      visible: "There was a problem loading the project.*"
    commands:
      - openLink: ${MAESTRO_DEV_CLIENT_URL}
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Go home"
      notVisible: "There was a problem loading the project.*"
    commands:
      # "Go home" shows while the sheet still slides up; its ✕ (accessibility label
      # "Close") is not hittable until the sheet settles.
      - extendedWaitUntil:
          visible: "Close"
          timeout: 10000
      - tapOn: "Close"
      - waitForAnimationToEnd
