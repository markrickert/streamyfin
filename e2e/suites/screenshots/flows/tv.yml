# TV screenshot pass (Android TV and Apple TV): the same flow runs on the before and after
# builds. Needs the session bootstrap-login-tv.yml leaves behind, so no clearState here. Tabs
# and items are tapped, which the Android TV emulator accepts like a click and the tvOS
# Maestro fork clicks like a D-pad select: a remote press that follows another too fast is
# dropped, and a tap does not depend on where the focus was. The app still draws its own
# focus ring on whatever it focuses on arrival, so that shows in the shots.
# Never open a Home title: on TV, Center/Select on a Home card starts playback, which
# changes the fixture account. A card in the Shows library is safe — it pushes the
# series route. Screenshot names are the pairing key for compare.ts, so keep them stable.
appId: ${MAESTRO_APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: ".*Recently added.*"
    timeout: 60000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 6000
    optional: true
- takeScreenshot: 01-home

- tapOn: "Search"
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 4000
    optional: true
- takeScreenshot: 02-search

- tapOn: "Favorites"
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 4000
    optional: true
- takeScreenshot: 03-favorites

- tapOn: "Library"
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 5000
    optional: true
- takeScreenshot: 04-library

- tapOn: "Settings"
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 4000
    optional: true
- takeScreenshot: 05-settings

- tapOn: "Library"
- tapOn: "Movies"
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 8000
    optional: true
- takeScreenshot: 06-library-movies

# The toolbar's Filters action opens the library sheet as a pushed modal route. The
# "Genres" group card only exists inside it, so its visibility proves the sheet opened.
# Nothing is selected — read-only — and the two Backs walk out of it: the first closes
# the sheet, the second leaves the library.
- tapOn: ".*Filters.*"
- extendedWaitUntil:
    visible: ".*Genres.*"
    timeout: 10000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 2000
    optional: true
- takeScreenshot: 08-library-filters
- pressKey: Back
- pressKey: Back

# The Inactivity timeout modal: the TV modal panel is where a color change shows most. Rows
# ignore touch, so the D-pad moves the focus (two Downs from the tab bar) and Center opens
# it. Each press waits, because one that follows another too fast is dropped. The modal is
# only opened: no option is chosen, so no setting changes. No Home card is opened anywhere
# in this flow: Center/Select on one starts playback, and the fixture account must
# not play.
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 3000
    optional: true
- pressKey: Remote Dpad Down
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 1500
    optional: true
- pressKey: Remote Dpad Down
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 1500
    optional: true
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible: "24 hours"
    timeout: 10000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 2000
    optional: true
- takeScreenshot: 07-settings-modal
- pressKey: Back

# A series page: the seeded "Show" in the Shows library. Tapping the card clicks it
# like a remote Center, and the library's renderTVItem pushes the series route — unlike
# a Home poster, where Select would start playback. The anchor accepts the
# unplayed badge before "Show" and a possible year after it, but not "Shows".
# The season heading or Pilot episode proves the series page loaded.
- launchApp
- extendedWaitUntil:
    visible: ".*Recently added.*"
    timeout: 60000
- tapOn: "Library"
- tapOn: "Shows"
- extendedWaitUntil:
    visible: "^(.*, )?Show(,.*)?$"
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element: "^(.*, )?Show(,.*)?$"
- tapOn: "^(.*, )?Show(,.*)?$"
- extendedWaitUntil:
    visible: ".*Season.*|.*Pilot.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 4000
    optional: true
- takeScreenshot: 09-series-details
