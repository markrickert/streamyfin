# Phone screenshot pass: the same flow runs on the before and after builds, so every
# selector must exist on both. Tabs are found by their en.json text (device locale must be
# en-US). Needs the session that bootstrap-login-mobile.yml leaves behind, so no
# clearState here. Never play an item: the fixture account's history must stay frozen.
# Screenshot names are the pairing key for compare.ts, so keep them stable.
# waitForAnimationToEnd returns at once when nothing animates, so it cannot wait for
# content: wait on visible text, or settle for a fixed time where a screen has none (an
# optional wait for a string that is never shown is a sleep).
# iOS labels a row with its icon glyphs around the text ("<glyph>, Settings, <glyph>"),
# and the selector matches the whole label, so rows are matched with .*text.*.
# Each section starts with a relaunch instead of a back press: `back` is Android only, and
# a fresh Home gives every section the same starting point.
appId: ${MAESTRO_APP_ID}
---
- runFlow: _relaunch-home-mobile.yml
# Let posters and the hero decode before the first frame.
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-home

- tapOn: "Search"
# The tab focuses its field: the keyboard covers the tab bar and would sit in the shot.
- waitForAnimationToEnd
- hideKeyboard:
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "More"
- takeScreenshot: 02-search
# On iOS 26 the open Search tab collapses the tab bar to a Home button and the field; Home
# brings the other tabs back. On Android it is the Home tab itself.
- tapOn: "Home"
# The tap can miss while the collapsed bar animates, and "Library" would then match the
# Seerr page's pill instead of the tab. "More" only exists in the full tab bar, so tap
# Home again until it is back.
- repeat:
    while:
      notVisible: "More"
    times: 3
    commands:
      - waitForAnimationToEnd
      - tapOn: "Home"

- tapOn: "Library"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-libraries

- runFlow: _tap-more.yml
- waitForAnimationToEnd
- takeScreenshot: 04-more

- tapOn: ".*Settings.*"
- extendedWaitUntil:
    visible: ".*Playback & controls.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 1500
    optional: true
- takeScreenshot: 05-settings

- runFlow: _relaunch-home-mobile.yml
- runFlow: _tap-more.yml
- tapOn: ".*Sessions.*"
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 6000
    optional: true
- takeScreenshot: 06-sessions

- runFlow: _relaunch-home-mobile.yml
- tapOn: "Library"
- tapOn: ".*Movies.*"
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 8000
    optional: true
- takeScreenshot: 07-library-movies

- runFlow: _relaunch-home-mobile.yml
- tapOn: "Library"
- tapOn: ".*Music.*"
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 8000
    optional: true
- takeScreenshot: 08-library-music

# Item details: The Blacksmith in the Movies library. The seed drops a fixed file named
# for it, so the same title opens on every run — deterministic, unlike a card position
# in a row that is empty on the fixture account.
- runFlow: _relaunch-home-mobile.yml
- tapOn: "Library"
- tapOn: ".*Movies.*"
# The title sorts into the first rows. scrollUntilVisible swipes down as soon as its
# first look misses, so a grid that is still loading scrolls past it for good.
- extendedWaitUntil:
    visible: "The Blacksmith.*"
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element: "The Blacksmith.*"
- tapOn: "The Blacksmith.*"
- extendedWaitUntil:
    visible: ".*Blacksmith.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 5000
    optional: true
- takeScreenshot: 09-item-details

# The library filter sheet: the Movies library's Genres chip opens a bottom sheet over
# the grid. The chip renders before its options arrive, and a tap while the genre list
# is still loading opens nothing, so retry until the sheet is visible. iOS exposes only
# the "Bottom Sheet" container to Maestro, not its visible option count; Android exposes
# the count. The Blacksmith wait proves the page loaded; scrolling would hide the chip.
# Nothing is selected, and the swipe dismisses the sheet before the next section.
# Maestro's full text match needs a wildcard for the chip's merged iOS icon label.
- runFlow: _relaunch-home-mobile.yml
- tapOn: "Library"
- tapOn: ".*Movies.*"
- extendedWaitUntil:
    visible: "The Blacksmith.*"
    timeout: 15000
    optional: true
- tapOn: ".*Genres.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          while:
            notVisible: "Bottom Sheet"
          times: 4
          commands:
            - extendedWaitUntil:
                visible: "Bottom Sheet"
                timeout: 4000
                optional: true
            - runFlow:
                when:
                  notVisible: "Bottom Sheet"
                commands:
                  - tapOn: ".*Genres.*"
      - extendedWaitUntil:
          visible: "Bottom Sheet"
          timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          while:
            notVisible: ".* items"
          times: 4
          commands:
            - extendedWaitUntil:
                visible: ".* items"
                timeout: 4000
                optional: true
            - runFlow:
                when:
                  notVisible: ".* items"
                commands:
                  - tapOn: ".*Genres.*"
      - extendedWaitUntil:
          visible: ".* items"
          timeout: 30000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 5000
    optional: true
- takeScreenshot: 14-library-filter-sheet
- swipe:
    direction: DOWN

# Series details: the seeded "Show" series in the Shows library. iOS merges the
# unplayed count before the title ("2, Show") and may append a year. The anchor
# still rejects "Shows" (the library header). A series page plays nothing.
- runFlow: _relaunch-home-mobile.yml
- tapOn: "Library"
- tapOn: ".*Shows.*"
- extendedWaitUntil:
    visible: "^(.*, )?Show(,.*)?$"
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element: "^(.*, )?Show(,.*)?$"
- tapOn: "^(.*, )?Show(,.*)?$"
# The season dropdown and the Pilot episode card are what only a series page shows.
- extendedWaitUntil:
    visible: ".*Season.*|.*Pilot.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 5000
    optional: true
- takeScreenshot: 15-series-details
