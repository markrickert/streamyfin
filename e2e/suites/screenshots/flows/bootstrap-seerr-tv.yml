# Verifies the signed-in TV app (Android TV, and Apple TV through the tvOS Maestro fork)
# is connected to Seerr. There is no Seerr section in TV Settings: TV clients learn the
# Seerr URL and API key from the Streamyfin plugin on the Jellyfin server, pushed by
# seerr.py's provisioning helper, and JellyfinProvider signs in automatically. So this
# flow only proves the connection: the Search tab shows a Library | Discover switch once
# Seerr is set up, and a missing "Discover" badge fails the run.
# Run after the plugin provisioning and a fresh sign-in (bootstrap-login-tv.yml).
# Run: e2e/suites/screenshots/run.sh bootstrap-seerr-tv <out dir> [device]
appId: ${MAESTRO_APP_ID}
---
- runFlow: _relaunch-home-tv.yml
- runFlow: _focus-home-tab.yml
- pressKey: Remote Dpad Right
- runFlow:
    file: _assert-tab-focused.yml
    env:
      TAB_LABEL: "Search"
      TAB_ID: tv-nav-search
# tvOS NativeTabs selects a tab on focus; Android TV's JS TVNavBar switches on Center.
- runFlow:
    when:
      true: ${MAESTRO_TVOS != '1'}
    commands:
      - pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible: "Discover"
    timeout: 30000
