# Connects the phone app to Seerr only when it is not connected. The Search tab shows a Library |
# Discover switch once Seerr is set up, so a missing "Discover" means the bootstrap has to run.
# Needs the session bootstrap-login-mobile.yml leaves behind.
# Run: e2e/suites/screenshots/run.sh ensure-seerr-mobile <out dir> [device]
appId: ${MAESTRO_APP_ID}
---
- runFlow: _relaunch-home-mobile.yml
- tapOn: "Search"
- hideKeyboard:
    optional: true
- extendedWaitUntil:
    visible: "Discover"
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible: "Discover"
    file: bootstrap-seerr-mobile.yml

# The connected Seerr settings page, shot once no matter which path connected it —
# placing this inside the bootstrap would skip the shot whenever the plugin-pushed
# sign-in already exposed Discover. Read-only: Reset is waited on, never tapped, so
# the connection is untouched. The wait names the full "Reset Seerr config" label:
# a bare "Reset" could also match other settings rows.
- runFlow: _relaunch-home-mobile.yml
- runFlow: _tap-more.yml
- tapOn: ".*Settings.*"
- scrollUntilVisible:
    element: ".*Plugins.*"
- tapOn: ".*Plugins.*"
- tapOn: ".*Seerr.*"
- extendedWaitUntil:
    visible: ".*Reset Seerr config.*"
    timeout: 30000
- hideKeyboard:
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 13-seerr-settings
