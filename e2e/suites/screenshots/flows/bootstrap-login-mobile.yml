# Signs in on a phone build. Fresh state is the runner's job — it clears the test app
# and deep-links the dev client into this ref's Metro before this flow runs — so no
# clearState here: it would also wipe the dev-server URL the link just set. The login
# screen captures 00-login before the fields fill. Selectors must exist on both refs:
# have no testID, so they are found by their en.json placeholder text, and the device
# locale must be en-US.
# It also captures the two first-run screens, 00-login and 00-intro, so run it once per
# build with --out and the screenshots are the before/after pair for those screens.
# Reads MAESTRO_JELLYFIN_URL, MAESTRO_JELLYFIN_USER and MAESTRO_JELLYFIN_PASS from the
# environment: see run.sh for the contract. The runner passes them per platform.
# Run: e2e/suites/screenshots/run.sh bootstrap-login-mobile <out dir> [device]
appId: ${MAESTRO_APP_ID}
---
# Grant notifications before app assertions so the first-run OS prompt cannot cover them.
- launchApp:
    stopApp: false
    permissions:
      notifications: allow
# The dev menu can open after the bundle finishes loading, over a login screen that is
# already there, so dismiss again until the field is reachable instead of once up front.
- repeat:
    while:
      notVisible:
        id: "login-server-url"
    times: 60
    commands:
      - runFlow: _dismiss-dev-overlays.yml
      - waitForAnimationToEnd:
          timeout: 1000
# A slow cold start can mount Home long enough to open the intro sheet over the login
# screen, where it swallows every tap.
- runFlow:
    when:
      visible: "Welcome to Streamyfin|Bottom Sheet"
    file: _dismiss-intro-mobile.yml
    env:
      INTRO_SHOT: "0"
- assertVisible:
    id: "login-server-url"
# The screen fades in: a shot taken during the fade is dimmed and differs on timing alone.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 00-login
- tapOn:
    id: "login-server-url"
# Typing before the keyboard is up drops the text, and the app then probes an empty address.
- waitForAnimationToEnd:
    timeout: 1500
- inputText: ${MAESTRO_JELLYFIN_URL}
- tapOn:
    id: "login-connect"
# A connect with an empty or dropped address leaves a "Connection failed" alert over the
# screen. Answer it, type the address again and connect instead of failing the run.
- repeat:
    while:
      notVisible: "Username"
    times: 3
    commands:
      - extendedWaitUntil:
          visible: "Username|Connection failed"
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: "Connection failed"
          commands:
            - tapOn: "OK"
            - tapOn:
                id: "login-server-url"
            - waitForAnimationToEnd:
                timeout: 1500
            - eraseText: 100
            - inputText: ${MAESTRO_JELLYFIN_URL}
            - tapOn:
                id: "login-connect"
- extendedWaitUntil:
    visible: "Username"
    timeout: 30000
# Capture before typing secrets. Android has already hidden the keyboard after
# Connect; hideKeyboard there sends Back and can close the app.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard:
          optional: true
- waitForAnimationToEnd
- takeScreenshot: 00-login-connected
- tapOn: "Username"
- inputText: ${MAESTRO_JELLYFIN_USER}
- tapOn: "Password"
- inputText: ${MAESTRO_JELLYFIN_PASS}
- hideKeyboard:
    optional: true
# On iOS the keyboard dismiss can already submit the form, so the button may be gone.
- tapOn:
    text: "Log in"
    optional: true
# iOS offers to save the password right after sign-in and covers the intro sheet until it
# is answered. It never appears on Android.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Not Now"
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
            - waitForAnimationToEnd
# The first sign-in on a fresh install opens the intro sheet over Home.
- extendedWaitUntil:
    visible: "Bottom Sheet|Welcome to Streamyfin"
    timeout: 20000
    optional: true
- runFlow:
    file: _dismiss-intro-mobile.yml
    env:
      INTRO_SHOT: "1"
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
